# Chaotic-mapping augmentation parameters.
#
# These values match the supplementary table "Random seeds and chaotic-schedule
# parameters governing the data-augmentation perturbations".

logistic_map:
  x0: 0.4            # x_0: logistic-map initial value
  r: 3.9             # logistic-map control parameter

max_perturbation_rate:
  description: 0.3   # alpha_max
  model: 0.3         # beta_max
  code: 0.3          # gamma_max
